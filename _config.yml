# Что GitHub Pages НЕ публикует.
#
# Pages отдаёт наружу всё, что лежит в репозитории. Проверено 20.08.2026:
# https://visitblg.ru/CLAUDE.md и /ROADMAP.md открывались любому по прямой
# ссылке — то есть внутренняя проектная память и список открытых задач по
# безопасности этого же сайта были публичными.
#
# Файлы остаются в репозитории (они нужны в работе), но на сайт не уезжают.
# Работает это через Jekyll, который Pages запускает по умолчанию. Поэтому
# в репозитории НЕ должно появляться `.nojekyll` — с ним исключения перестанут
# действовать, и внутренние файлы снова станут доступны.
#
# В index.html и языковых версиях нет последовательностей `{{` и `{%`,
# поэтому Liquid ничего в них не портит — проверено перед включением.

exclude:
  - CLAUDE.md          # проектная память: решения, грабли, чего не возвращать
  - ROADMAP.md         # открытые задачи, включая чек-лист по безопасности
  - build/             # сборщик языковых версий и исходники словаря
  - articles/          # исходники статей: страницы из них собираются в /stati/
  - nom.json           # ответы Nominatim, остались от разметки координат
  - s.json             # ответы Commons API, остались от подбора фото
  - _config.yml

# Ничего не генерируем — сайт статический, Jekyll здесь только фильтрует файлы.
plugins: []
